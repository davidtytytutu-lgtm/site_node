<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>DAVID OFFICIEL</title>

<style>

let discoMode = false;



/* =====================================================
   DISCO MODE
===================================================== */

body.discoMode {

    animation: discoRGB 2s linear infinite;

}

@keyframes discoRGB {

    0% {
        filter: hue-rotate(0deg);
    }

    25% {
        filter: hue-rotate(90deg);
    }

    50% {
        filter: hue-rotate(180deg);
    }

    75% {
        filter: hue-rotate(270deg);
    }

    100% {
        filter: hue-rotate(360deg);
    }

}

/* =====================================================
   DISCO MODE
===================================================== */

body.discoMode {

    animation: discoColors 1.5s linear infinite;

}


body.discoMode #crt {

    animation: discoCRT 1.5s linear infinite;

}


@keyframes discoColors {

    0% {
        color: #ff0000;
        text-shadow: 0 0 5px #ff0000;
    }

    16% {
        color: #ffff00;
        text-shadow: 0 0 5px #ffff00;
    }

    33% {
        color: #00ff00;
        text-shadow: 0 0 5px #00ff00;
    }

    50% {
        color: #00ffff;
        text-shadow: 0 0 5px #00ffff;
    }

    66% {
        color: #0080ff;
        text-shadow: 0 0 5px #0080ff;
    }

    83% {
        color: #ff00ff;
        text-shadow: 0 0 5px #ff00ff;
    }

    100% {
        color: #ff0000;
        text-shadow: 0 0 5px #ff0000;
    }

}


@keyframes discoCRT {

    0% {
        filter: hue-rotate(0deg);
    }

    100% {
        filter: hue-rotate(360deg);
    }

}

/* =====================================================
   BASE
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {

    background: #020302;

    color: #00ff66;

    font-family:
        "Courier New",
        monospace;

    overflow-x: hidden;

    overflow-y: auto;

    min-height: 100vh;

    text-shadow:
        0 0 4px rgba(0,255,102,.5);
}

#mediaNameInput {

    width: 220px;

    background: #001a08;

    color: #00ff66;

    border: 1px solid #00ff66;

    padding: 5px 8px;

    font-family:
        "Courier New",
        monospace;

    outline: none;
}

#mediaNameInput::placeholder {

    color: rgba(0,255,102,.5);

}

#mediaNameInput:focus {

    box-shadow:
        0 0 8px rgba(0,255,102,.3);

}

/* =====================================================
   MEDIA LIGHTBOX
===================================================== */

#mediaLightbox {

    position: fixed;

    inset: 0;

    z-index: 2000;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 30px;

    background:
        rgba(0,0,0,.88);

    backdrop-filter:
        blur(5px);

    cursor: zoom-out;
}


/* =====================================================
   LIGHTBOX CONTENT
===================================================== */

#mediaLightboxContent {

    position: relative;

    max-width: 95vw;

    max-height: 95vh;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    border:
        1px solid #00ff66;

    background:
        rgba(0,10,4,.96);

    box-shadow:
        0 0 30px rgba(0,255,102,.25),
        inset 0 0 30px rgba(0,255,102,.05);

    padding: 12px;

    cursor: default;
}


/* =====================================================
   VIEWER
===================================================== */

#mediaLightboxViewer {

    max-width: 90vw;

    max-height: 82vh;

    display: flex;

    align-items: center;

    justify-content: center;

    overflow: hidden;
}


#mediaLightboxViewer img {

    display: block;

    max-width: 90vw;

    max-height: 82vh;

    width: auto;

    height: auto;

    object-fit: contain;

    box-shadow:
        0 0 20px rgba(0,255,102,.15);
}


#mediaLightboxViewer video {

    display: block;

    max-width: 90vw;

    max-height: 82vh;

    width: auto;

    height: auto;

    background: #000;

    box-shadow:
        0 0 20px rgba(0,255,102,.15);
}


/* =====================================================
   CLOSE BUTTON
===================================================== */

#mediaLightboxClose {

    position: absolute;

    top: -15px;

    right: -15px;

    width: 34px;

    height: 34px;

    border:
        1px solid #00ff66;

    background:
        #001a08;

    color:
        #00ff66;

    font-family:
        "Courier New",
        monospace;

    font-size: 18px;

    cursor: pointer;

    z-index: 10;

    box-shadow:
        0 0 10px rgba(0,255,102,.3);
}


#mediaLightboxClose:hover {

    background:
        #00ff66;

    color:
        #001a08;

}


/* =====================================================
   FILE NAME
===================================================== */

#mediaLightboxName {

    width: 100%;

    margin-top: 8px;

    padding-top: 6px;

    border-top:
        1px solid rgba(0,255,102,.3);

    text-align: center;

    font-size: 11px;

    word-break: break-all;

    opacity: .8;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 700px) {

    #mediaLightbox {

        padding: 15px;

    }


    #mediaLightboxContent {

        max-width: 100vw;

        max-height: 95vh;

        padding: 8px;

    }


    #mediaLightboxViewer {

        max-width: 96vw;

        max-height: 82vh;

    }


    #mediaLightboxViewer img,
    #mediaLightboxViewer video {

        max-width: 96vw;

        max-height: 80vh;

    }


    #mediaLightboxClose {

        top: -10px;

        right: -10px;

    }

}


/* =====================================================
   CRT
===================================================== */

#crt {

    position: relative;

    width: 100%;

    min-height: 100vh;

    overflow: visible;

    border-radius: 4%;

    transform:
        perspective(900px)
        scale(.985);

    background:
        radial-gradient(
            ellipse at center,
            rgba(0,40,15,.25),
            rgba(0,0,0,.95)
        );

    box-shadow:
        inset 0 0 100px rgba(0,0,0,.95),
        inset 0 0 30px rgba(0,255,100,.08),
        0 0 30px #000;
}

    border-radius: 4%;

    transform:
        perspective(900px)
        scale(.985);

    background:
        radial-gradient(
            ellipse at center,
            rgba(0,40,15,.25),
            rgba(0,0,0,.95)
        );

    box-shadow:
        inset 0 0 100px rgba(0,0,0,.95),
        inset 0 0 30px rgba(0,255,100,.08),
        0 0 30px #000;
}

#crt::before {

    content: "";

    position: absolute;

    inset: -5%;

    pointer-events: none;

    z-index: 900;

    border-radius: 8%;

    background:
        radial-gradient(
            ellipse at center,
            transparent 55%,
            rgba(0,0,0,.15) 75%,
            rgba(0,0,0,.75) 100%
        );
}


/* =====================================================
   SCANLINES
===================================================== */

#scanlines {

    position: fixed;

    inset: 0;

    pointer-events: none;

    z-index: 950;

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,.025) 0px,
            rgba(255,255,255,.025) 1px,
            rgba(0,0,0,.13) 2px,
            rgba(0,0,0,.13) 4px
        );

    animation:
        scanMove .12s linear infinite;
}

@keyframes scanMove {

    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(4px);
    }
}


/* =====================================================
   VHS
===================================================== */

#vhs {

    position: fixed;

    inset: 0;

    pointer-events: none;

    z-index: 960;

    opacity: .12;

    background-image:
        repeating-linear-gradient(
            0deg,
            transparent 0px,
            transparent 2px,
            rgba(255,255,255,.12) 3px
        );

    animation:
        vhsMove .15s steps(2) infinite;
}

@keyframes vhsMove {

    0% {
        transform: translate(0,0);
    }

    25% {
        transform: translate(2px,-1px);
    }

    50% {
        transform: translate(-1px,1px);
    }

    75% {
        transform: translate(1px,0);
    }

    100% {
        transform: translate(0,0);
    }
}


/* =====================================================
   RGB GLITCH
===================================================== */

#rgb-glitch {

    position: fixed;

    inset: 0;

    pointer-events: none;

    z-index: 970;

    mix-blend-mode: screen;

    opacity: .04;

    background:
        linear-gradient(
            90deg,
            rgba(255,0,0,.5),
            transparent 30%,
            transparent 70%,
            rgba(0,0,255,.5)
        );

    animation:
        rgbShift 3s infinite steps(2);
}

@keyframes rgbShift {

    0%,95%,100% {
        transform: translateX(0);
    }

    96% {
        transform: translateX(4px);
    }

    97% {
        transform: translateX(-3px);
    }

    98% {
        transform: translateX(2px);
    }
}


/* =====================================================
   BOOT
===================================================== */

#boot {

    position: fixed;

    inset: 0;

    z-index: 500;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    background: #020302;
}

#bootText {

    width: min(700px,90%);

    line-height: 1.5;

    margin-bottom: 25px;

    white-space: pre-wrap;
}

#bootBar {

    width: min(700px,90%);

    height: 20px;

    border: 1px solid #00ff66;

    padding: 2px;
}

#bootProgress {

    height: 100%;

    width: 0%;

    background: #00ff66;

    box-shadow:
        0 0 10px #00ff66;

    transition: width .08s linear;
}

#bootPercent {
    margin-top: 10px;
}


/* =====================================================
   APP
===================================================== */

#app {

    position: relative;

    z-index: 10;

    display: none;

    width: 100%;

    min-height: 100vh;

    padding: 15px;

    gap: 12px;

    grid-template-columns:
        1.4fr
        1fr
        1fr;

    grid-template-rows:
        55px
        350px
        500px
        180px;
}


/* =====================================================
   HEADER
===================================================== */

#header {

    grid-column: 1 / 4;

    border: 1px solid #00ff66;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 15px;

    background:
        rgba(0,15,5,.75);

    box-shadow:
        0 0 12px rgba(0,255,102,.12);
}

#title {

    font-size: 18px;

    font-weight: bold;
}

#connection {
    font-size: 13px;
}


/* =====================================================
   PANELS
===================================================== */

.panel {

    position: relative;

    min-width: 0;

    min-height: 0;

    border: 1px solid #00ff66;

    background:
        rgba(0,10,4,.82);

    overflow: hidden;

    box-shadow:
        inset 0 0 25px rgba(0,255,102,.04);
}

.panelTitle {

    height: 32px;

    border-bottom:
        1px solid #00ff66;

    display: flex;

    align-items: center;

    padding-left: 10px;

    background:
        rgba(0,255,102,.06);

    font-weight: bold;

    font-size: 13px;
}


/* =====================================================
   TERMINAL
===================================================== */

#terminalPanel {

    grid-column: 1;

    grid-row: 2;
}

#terminalOutput {

    position: absolute;

    top: 32px;

    bottom: 40px;

    left: 0;

    right: 0;

    padding: 10px;

    overflow-y: auto;

    white-space: pre-wrap;

    scrollbar-width: thin;
}

#terminalInputLine {

    position: absolute;

    bottom: 0;

    left: 0;

    right: 0;

    height: 40px;

    display: flex;

    align-items: center;

    padding: 0 10px;

    border-top:
        1px solid rgba(0,255,102,.4);
}

#terminalInput {

    flex: 1;

    background: transparent;

    border: none;

    outline: none;

    color: #00ff66;

    font-family:
        "Courier New",
        monospace;

    font-size: 14px;
}


/* =====================================================
   CHAT
===================================================== */

#chatPanel {

    grid-column: 2;

    grid-row: 2;
}

#chatMessages {

    position: absolute;

    top: 32px;

    bottom: 42px;

    left: 0;

    right: 0;

    padding: 10px;

    overflow-y: auto;

    white-space: pre-wrap;
}

#chatInputLine {

    position: absolute;

    bottom: 0;

    left: 0;

    right: 0;

    height: 42px;

    display: flex;

    border-top:
        1px solid rgba(0,255,102,.4);
}

#chatInput {

    flex: 1;

    background: transparent;

    border: none;

    outline: none;

    color: #00ff66;

    padding: 0 10px;

    font-family:
        "Courier New",
        monospace;
}


/* =====================================================
   USERS
===================================================== */

#usersPanel {

    grid-column: 3;

    grid-row: 2;
}

#usersList {

    padding: 10px;

    overflow-y: auto;

    height:
        calc(100% - 32px);
}


/* =====================================================
   MEDIA
===================================================== */

#mediaPanel {

    /* Largeur : les 3 colonnes */
    grid-column: 1 / 4;

    /* Hauteur : ligne 3 */
    grid-row: 3;

    /* IMPORTANT : permet au contenu de bien se réduire */
    min-width: 0;
    min-height: 0;

}


/* =====================================================
   MEDIA CONTENT
===================================================== */

#mediaContent {

    position: absolute;

    inset: 32px 0 0 0;

    display: flex;

    flex-direction: column;

    overflow: hidden;

}


/* =====================================================
   MEDIA CONTROLS
===================================================== */

#mediaControls {

    padding: 8px;

    border-bottom:
        1px solid rgba(0,255,102,.35);

    display: flex;

    gap: 8px;

    align-items: center;

    flex-wrap: wrap;

    flex-shrink: 0;

}


#mediaFile {

    max-width: 220px;

    color: #00ff66;

    font-family:
        "Courier New",
        monospace;
}


.mediaButton {

    background: #001a08;

    color: #00ff66;

    border: 1px solid #00ff66;

    padding: 5px 10px;

    font-family:
        "Courier New",
        monospace;

    cursor: pointer;

}


.mediaButton:hover {

    background: #00ff66;

    color: #001a08;

}


#mediaStatus {

    font-size: 11px;

    width: 100%;

}


#mediaProgress {

    width: 100%;

    height: 8px;

    border: 1px solid #00ff66;

    display: none;

}


#mediaProgressBar {

    height: 100%;

    width: 0%;

    background: #00ff66;

    box-shadow:
        0 0 8px #00ff66;

}


/* =====================================================
   MEDIA LIST
===================================================== */

#mediaList {

    flex: 1;

    min-height: 0;

    overflow-y: auto;

    padding: 10px;

    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(180px, 1fr));

    grid-auto-rows: max-content;

    gap: 10px;

}


/* =====================================================
   MEDIA ITEM
===================================================== */

.mediaItem {

    border:
        1px solid rgba(0,255,102,.5);

    padding: 6px;

    min-width: 0;

    background:
        rgba(0,20,7,.7);

}


/* =====================================================
   IMAGE / VIDEO
===================================================== */

.mediaPreview {
    display: block;

    width: auto;
    height: auto;

    max-width: 100%;
    max-height: 250px;

    background: #000;

    margin: 0 auto 5px auto;

    cursor: zoom-in;
}


/* =====================================================
   NAME
===================================================== */

.mediaName {

    font-size: 10px;

    word-break: break-all;

    margin-bottom: 4px;

}


/* =====================================================
   INFO
===================================================== */

.mediaInfo {

    font-size: 9px;

    opacity: .7;

    margin-bottom: 5px;

}


/* =====================================================
   OPEN
===================================================== */

.mediaOpen {

    color: #00ff66;

    font-size: 10px;

}
/* =====================================================
   DIR
===================================================== */

#dirPanel {
    grid-column: 3;
    grid-row: 4;
}

#dirOutput {

    position: absolute;

    inset: 32px 0 0 0;

    overflow: hidden;

    padding: 10px;

    font-size: 12px;

    line-height: 1.35;
}

.dirLine {

    opacity: .8;

    animation:
        dirAppear .2s linear;
}

@keyframes dirAppear {

    from {
        opacity: 0;
    }

    to {
        opacity: .8;
    }
}


/* =====================================================
   MATRIX
===================================================== */

#matrixPanel {
    grid-column: 1 / 3;
    grid-row: 4;
}

#matrix {

    position: absolute;

    inset: 32px 0 0 0;

    width: 100%;

    height:
        calc(100% - 32px);
}


/* =====================================================
   MARLEY
===================================================== */

#marley {

    position: fixed;

    inset: 0;

    z-index: 800;

    display: none;

    align-items: center;

    justify-content: center;

    pointer-events: none;

    background:
        radial-gradient(
            circle,
            rgba(255,0,120,.25),
            transparent 65%
        );
}

#marleyText {

    font-size:
        clamp(30px,8vw,100px);

    text-align: center;

    font-weight: bold;

    animation:
        marleyAnim 3s ease forwards;
}

@keyframes marleyAnim {

    0% {
        opacity: 0;
        transform:
            scale(.1)
            rotate(-30deg);
    }

    25% {
        opacity: 1;
        transform:
            scale(1.3)
            rotate(10deg);
    }

    50% {
        transform:
            scale(1)
            rotate(-5deg);
    }

    75% {
        opacity: 1;
        transform:
            scale(1.1);
    }

    100% {
        opacity: 0;
        transform:
            scale(1.5);
    }
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 900px) {

    body {
        overflow: auto;
    }

    #app {

        position: relative;

        min-height: 100vh;

        grid-template-columns:
            1fr 1fr;

        grid-template-rows:
            55px
            350px
            350px
            300px
            300px;

    }

    #header {
        grid-column: 1 / 3;
    }

    #terminalPanel {
        grid-column: 1;
        grid-row: 2;
    }

    #chatPanel {
        grid-column: 2;
        grid-row: 2;
    }

    #usersPanel {
        grid-column: 1 / 3;
        grid-row: 3;
    }

    #mediaPanel {
        grid-column: 1 / 3;
        grid-row: 4;
    }

    #matrixPanel {
        grid-column: 1;
        grid-row: 5;
    }

    #dirPanel {
        grid-column: 2;
        grid-row: 5;
    }

}

</style>

</head>

</div>

/* =====================================================
   CONNECT
===================================================== */

function connect() {

    username =
        prompt(
            "Choisis ton username temporaire :"
        );


    if (!username) {

        username =
            "guest";

    }


    username =
        username
            .replace(/[<>]/g, "")
            .substring(0,20);


    terminalPrompt.textContent =
        username +
        "@terminal:~$";


    terminalPrint(
        "Initialisation..."
    );

    terminalPrint(
        "Connexion au serveur..."
    );

    terminalPrint(
        "マーリーを愛しています..."
    );

    socket =
        new WebSocket(
            SERVER
        );


    socket.onopen = () => {

        connection.textContent =
            "● ONLINE";


        terminalPrint(
            "[OK] Serveur connecté."
        );


        socket.send(
            JSON.stringify({

                type:
                    "join",

                username:
                    username

            })
        );


        terminalInput.focus();

    };


    socket.onmessage = event => {

        let data;

        try {

            data =
                JSON.parse(
                    event.data
                );

        } catch {

            return;

        }


        if (
            data.type ===
            "system"
        ) {

            terminalPrint(
                "[SYSTEM] " +
                data.message
            );

        }


        if (
            data.type ===
            "join"
        ) {

            terminalPrint(
                "[+] " +
                data.username +
                " vient de rejoindre."
            );

        }


        if (
            data.type ===
            "leave"
        ) {

            terminalPrint(
                "[-] " +
                data.username +
                " est parti."
            );

        }


        if (
            data.type ===
            "chat"
        ) {

            chatPrint(
                data.username,
                data.message
            );

        }


        if (
            data.type ===
            "users"
        ) {

            usersList.textContent =
                "SYSTEM: " +
                data.users.length +
                " USERS\n\n" +
                data.users.join("\n");

        }


        if (
            data.type ===
            "marley"
        ) {

            terminalPrint(
                "[EASTER EGG] " +
                data.username +
                " a trouvé quelque chose..."
            );

            marleyAnimation();

        }


        /* NOUVEAU MEDIA */

        if (
            data.type ===
            "media"
        ) {

            terminalPrint(
                "[MEDIA] " +
                data.username +
                " a uploadé " +
                data.name
            );

            addMedia(data);

        }

    };


    socket.onerror = () => {

        connection.textContent =
            "● ERROR";

        terminalPrint(
            "[ERROR] WebSocket error."
        );

    };


    socket.onclose = () => {

        connection.textContent =
            "● OFFLINE";

        terminalPrint(
            "[SYSTEM] Connexion perdue."
        );


        if (
            !reconnectTimer
        ) {

            reconnectTimer =
                setTimeout(
                    () => {

                        reconnectTimer =
                            null;

                        terminalPrint(
                            "[SYSTEM] Reconnexion..."
                        );

                        connect();

                    },
                    5000
                );

        }

    };

}

            message:

        })
    );

}

function formatSize(bytes) {

    if (bytes < 1024)
        return bytes + " B";

    if (bytes < 1024 * 1024)
        return (
            (bytes / 1024).toFixed(1)
            + " KB"
        );

    return (
        (bytes / 1024 / 1024).toFixed(2)
        + " MB"
    );

}


function isVideo(file) {

    const name =
        file.name.toLowerCase();

    return (
        name.endsWith(".mp4") ||
        name.endsWith(".webm") ||
        name.endsWith(".mov")
    );

}

/* =====================================================
   MEDIA DISPLAY
===================================================== */

function addMedia(file) {

    const mediaPath =
        file.path ||
        file.name;


    if (
        document.querySelector(
            `[data-media-path="${CSS.escape(mediaPath)}"]`
        )
    ) {
        return;
    }


    const item =
        document.createElement("div");

    item.className =
        "mediaItem";

    item.dataset.mediaPath =
        mediaPath;


    let preview;


    /* =========================
       VIDEO MP4 / WEBM / MOV
    ========================= */

    if (isVideo(file)) {

        preview =
            document.createElement("video");

        preview.className =
            "mediaPreview";

        preview.src =
            file.url;

        preview.controls =
            true;

        preview.preload =
            "metadata";

        preview.playsInline =
            true;

        preview.muted =
            true;

    }


    /* =========================
       IMAGE / GIF / WEBP
    ========================= */

    else {

        preview =
            document.createElement("img");

        preview.className =
            "mediaPreview";

        preview.src =
            file.url;

        preview.alt =
            file.name;

    }


    /* =========================
       OPEN LIGHTBOX
    ========================= */

    preview.addEventListener(
        "dblclick",
        event => {

            event.preventDefault();

            openMediaLightbox(file);

        }
    );


    preview.style.cursor =
        "zoom-in";


    /* =========================
       NAME
    ========================= */

    const name =
        document.createElement("div");

    name.className =
        "mediaName";

    name.textContent =
        file.name;


    /* =========================
       INFO
    ========================= */

    const info =
        document.createElement("div");

    info.className =
        "mediaInfo";

    info.textContent =
        formatSize(
            file.size || 0
        );


    /* =========================
       OPEN LINK
    ========================= */

    const link =
        document.createElement("a");

    link.className =
        "mediaOpen";

    link.href =
        file.url;

    link.target =
        "_blank";

    link.rel =
        "noopener";

    link.textContent =
        "[ OPEN ]";


    /* =========================
       APPEND
    ========================= */

    item.appendChild(
        preview
    );

    item.appendChild(
        name
    );

    item.appendChild(
        info
    );

    item.appendChild(
        link
    );


    mediaList.prepend(
        item
    );

}

/* =====================================================
   LOAD MEDIA
===================================================== */

async function loadMedia() {

    if (!mediaList) {
        console.error("[MEDIA] mediaList introuvable.");
        return;
    }

    try {

        mediaStatus.textContent =
            "LOADING MEDIA...";

        const response =
            await fetch(
                API + "/api/media"
            );

        if (!response.ok) {

            throw new Error(
                "HTTP " + response.status
            );

        }

        const files =
            await response.json();


        mediaList.innerHTML =
            "";


        if (!Array.isArray(files)) {

            throw new Error(
                "Réponse serveur invalide."
            );

        }


        files.forEach(
            file => {

                addMedia(file);

            }
        );


        mediaStatus.textContent =
            "[OK] " +
            files.length +
            " MEDIA LOADED.";


    } catch (error) {

        console.error(
            "[MEDIA] Erreur chargement :",
            error
        );

        mediaStatus.textContent =
            "[ERROR] MEDIA SYSTEM OFFLINE.";

    }

}

uploadButton.addEventListener(

        const MAX =

        let customName =

if (!customName) {

            ""
        );

}


/* Nettoyage du nom */

customName =
    customName
        .replace(/[<>:"/\\|?*\x00-\x1F]/g, "")
        .replace(/\s+/g, " ")
        .trim()
        .substring(0, 100);


if (!customName) {

    mediaStatus.textContent =
        "[ERROR] INVALID FILE NAME.";

    return;

}


/* Garder l'extension originale */

const extension =
    file.name.includes(".")
        ? "." +
          file.name
              .split(".")
              .pop()
              .toLowerCase()
        : "";


const finalName =
    customName +
    extension;


/* Créer le fichier avec le nouveau nom */

const renamedFile =
    new File(
        [file],
        finalName,
        {
            type: file.type
        }
    );


const form =
    new FormData();


form.append(
    "file",
    renamedFile
);

form.append(
    "username",
    username
);

        const xhr =
            new XMLHttpRequest();


        xhr.open(
            "POST",
            API + "/api/upload"
        );


        mediaProgress.style.display =
            "block";

        mediaProgressBar.style.width =
            "0%";

        uploadButton.disabled =
            true;


        mediaStatus.textContent =
            "UPLOADING...";


        xhr.upload.onprogress =
            event => {

                if (!event.lengthComputable)
                    return;


                const percent =
                    Math.round(
                        event.loaded /
                        event.total *
                        100
                    );


                mediaProgressBar.style.width =
                    percent + "%";


                mediaStatus.textContent =
                    "UPLOADING... " +
                    percent +
                    "%";

            };


        xhr.onload =
            () => {

                uploadButton.disabled =
                    false;


                let data;

                try {

                    data =
                        JSON.parse(
                            xhr.responseText
                        );

                } catch {

                    data = {};

                }


                if (
                    xhr.status >= 200 &&
                    xhr.status < 300 &&
                    data.success
                ) {

                    mediaStatus.textContent =
                        "[OK] UPLOAD COMPLETE.";


                    addMedia({

                        name:
                            data.name,

                        url:
                            data.url,

                        size:
                            data.size,

                        path:
                            "uploaded/" +
                            data.name

                    });


                    mediaFile.value =
                        "";


                } else {

                    mediaStatus.textContent =
                        "[ERROR] " +
                        (
                            data.error ||
                            "UPLOAD FAILED."
                        );

                }

            };


        xhr.onerror =
            () => {

                uploadButton.disabled =
                    false;

                mediaStatus.textContent =
                    "[ERROR] NETWORK ERROR.";

            };


        xhr.onloadend =
            () => {

                setTimeout(
                    () => {

                        mediaProgress.style.display =
                            "none";

                    },
                    1000
                );

            };


        xhr.send(form);

    }
);

/* =====================================================
   MATRIX
===================================================== */

function startMatrix() {

    const canvas =
        document.getElementById(
            "matrix"
        );

    const ctx =
        canvas.getContext("2d");


    function resize() {

        canvas.width =
            canvas.clientWidth;

        canvas.height =
            canvas.clientHeight;

    }


    resize();


    window.addEventListener(
        "resize",
        resize
    );


    const chars =
        "01#$%アイウエオ親愛なるプラウト愛してるよ、マーリー";


    const fontSize =
        12;


    let columns =
        Math.floor(
            canvas.width /
            fontSize
        );


    let drops =
        new Array(
            columns
        ).fill(1);


    setInterval(
        () => {

            ctx.fillStyle =
                "rgba(0,0,0,.08)";

            ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            ctx.fillStyle =
                "#00ff66";

            ctx.font =
                fontSize +
                "px monospace";


            for (
                let i = 0;
                i < drops.length;
                i++
            ) {

                const char =
                    chars[
                        Math.floor(
                            Math.random() *
                            chars.length
                        )
                    ];


                ctx.fillText(
                    char,
                    i * fontSize,
                    drops[i] *
                    fontSize
                );


                if (
                    drops[i] *
                    fontSize >
                    canvas.height &&
                    Math.random() >
                    .975
                ) {

                    drops[i] = 0;

                }


                drops[i]++;

            }

        },
        45
    );

}
