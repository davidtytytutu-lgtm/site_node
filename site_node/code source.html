<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>DAVID OFFICIEL</title>

<style>

/* =====================================================
   BASE
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;

    padding: 0;

    min-height: 100vh;

    background: #020302;

    color: #00ff66;

    font-family:
        "Courier New",
        monospace;

    overflow-x: hidden;
    overflow-y: auto;
    
    text-shadow:
        0 0 4px rgba(0,255,102,.5);
}


/* =====================================================
   CRT
===================================================== */

#crt {

    position: relative;

    width: 100%;

    min-height: 100vh;

    overflow: visible;

    border-radius: 4%;

    transform:
        perspective(900px)
        scale(.985);

    background:
        radial-gradient(
            ellipse at center,
            rgba(0,40,15,.25),
            rgba(0,0,0,.95)
        );

    box-shadow:
        inset 0 0 100px rgba(0,0,0,.95),
        inset 0 0 30px rgba(0,255,100,.08),
        0 0 30px #000;
}


#crt::before {

    content: "";

    position: absolute;

    inset: -5%;

    pointer-events: none;

    z-index: 900;

    border-radius: 8%;

    background:
        radial-gradient(
            ellipse at center,
            transparent 55%,
            rgba(0,0,0,.15) 75%,
            rgba(0,0,0,.75) 100%
        );
}


/* =====================================================
   SCANLINES
===================================================== */

#scanlines {

    position: fixed;

    inset: 0;

    pointer-events: none;

    z-index: 950;

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,.025) 0px,
            rgba(255,255,255,.025) 1px,
            rgba(0,0,0,.13) 2px,
            rgba(0,0,0,.13) 4px
        );

    animation:
        scanMove .12s linear infinite;
}


@keyframes scanMove {

    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(4px);
    }
}


/* =====================================================
   VHS
===================================================== */

#vhs {

    position: fixed;

    inset: 0;

    pointer-events: none;

    z-index: 960;

    opacity: .12;

    background-image:
        repeating-linear-gradient(
            0deg,
            transparent 0px,
            transparent 2px,
            rgba(255,255,255,.12) 3px
        );

    animation:
        vhsMove .15s steps(2) infinite;
}


@keyframes vhsMove {

    0% {
        transform: translate(0,0);
    }

    25% {
        transform: translate(2px,-1px);
    }

    50% {
        transform: translate(-1px,1px);
    }

    75% {
        transform: translate(1px,0);
    }

    100% {
        transform: translate(0,0);
    }
}


/* =====================================================
   RGB GLITCH
===================================================== */

#rgb-glitch {

    position: fixed;

    inset: 0;

    pointer-events: none;

    z-index: 970;

    mix-blend-mode: screen;

    opacity: .04;

    background:
        linear-gradient(
            90deg,
            rgba(255,0,0,.5),
            transparent 30%,
            transparent 70%,
            rgba(0,0,255,.5)
        );

    animation:
        rgbShift 3s infinite steps(2);
}


@keyframes rgbShift {

    0%,
    95%,
    100% {
        transform: translateX(0);
    }

    96% {
        transform: translateX(4px);
    }

    97% {
        transform: translateX(-3px);
    }

    98% {
        transform: translateX(2px);
    }
}


/* =====================================================
   DISCO
===================================================== */

body.discoMode {

    animation:
        discoRGB 2s linear infinite;
}


body.discoMode #crt {

    animation:
        discoCRT 1.5s linear infinite;
}


@keyframes discoRGB {

    0% {
        filter: hue-rotate(0deg);
    }

    25% {
        filter: hue-rotate(90deg);
    }

    50% {
        filter: hue-rotate(180deg);
    }

    75% {
        filter: hue-rotate(270deg);
    }

    100% {
        filter: hue-rotate(360deg);
    }
}


@keyframes discoCRT {

    0% {
        filter: hue-rotate(0deg);
    }

    100% {
        filter: hue-rotate(360deg);
    }
}


/* =====================================================
   BOOT
===================================================== */

#boot {

    position: fixed;

    inset: 0;

    z-index: 5000;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    background: #020302;
}


#bootText {

    width: min(700px,90%);

    line-height: 1.5;

    margin-bottom: 25px;

    white-space: pre-wrap;
}


#bootBar {

    width: min(700px,90%);

    height: 20px;

    border: 1px solid #00ff66;

    padding: 2px;
}


#bootProgress {

    height: 100%;

    width: 0%;

    background: #00ff66;

    box-shadow:
        0 0 10px #00ff66;

    transition:
        width .08s linear;
}


#bootPercent {

    margin-top: 10px;
}


/* =====================================================
   APP
===================================================== */

#app {

    position: relative;

    z-index: 10;

    display: none;

    width: 100%;

    min-height: 100vh;

    padding: 15px;

    gap: 12px;

    grid-template-columns:
        1.4fr
        1fr
        1fr;

    grid-template-rows:
        55px
        auto
        350px
        500px
        180px;
}


/* =====================================================
   HEADER
===================================================== */

#header {

    grid-column: 1 / 4;

    border: 1px solid #00ff66;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 15px;

    background:
        rgba(0,15,5,.75);

    box-shadow:
        0 0 12px rgba(0,255,102,.12);
}


#title {

    font-size: 18px;

    font-weight: bold;
}


#connection {

    font-size: 13px;
}


/* =====================================================
   ACCOUNT
===================================================== */

#account-panel,
#account-profile {

    border:
        1px solid #00ff66;

    padding: 15px;

    background:
        rgba(0,10,4,.82);

    box-shadow:
        inset 0 0 25px rgba(0,255,102,.04);
}


#account-panel {

    grid-column: 1 / 4;

    grid-row: 2;
}


#account-profile {

    grid-column: 1 / 4;

    grid-row: 2;

    align-items: center;

    gap: 15px;
}


#account-panel input {

    display: block;

    width: 100%;

    max-width: 300px;

    margin: 8px 0;

    padding: 10px;

    box-sizing: border-box;

    background: #001a08;

    color: #00ff66;

    border:
        1px solid #00ff66;

    outline: none;

    font-family:
        "Courier New",
        monospace;
}


#account-panel button,
#account-profile button {

    margin: 5px 0;

    padding: 8px 14px;

    cursor: pointer;

    background: #001a08;

    color: #00ff66;

    border:
        1px solid #00ff66;

    font-family:
        "Courier New",
        monospace;
}


#account-panel button:hover,
#account-profile button:hover {

    background: #00ff66;

    color: #001a08;
}


#account-avatar {

    border-radius: 50%;

    object-fit: cover;

    border:
        1px solid #00ff66;
}


#login-error,
#register-error {

    color: red;
}


/* =====================================================
   PANELS
===================================================== */

.panel {

    position: relative;

    min-width: 0;

    min-height: 0;

    border:
        1px solid #00ff66;

    background:
        rgba(0,10,4,.82);

    overflow: hidden;

    box-shadow:
        inset 0 0 25px rgba(0,255,102,.04);
}


.panelTitle {

    height: 32px;

    border-bottom:
        1px solid #00ff66;

    display: flex;

    align-items: center;

    padding-left: 10px;

    background:
        rgba(0,255,102,.06);

    font-weight: bold;

    font-size: 13px;
}


/* =====================================================
   TERMINAL
===================================================== */

#terminalPanel {

    grid-column: 1;

    grid-row: 3;
}


#terminalOutput {

    position: absolute;

    top: 32px;

    bottom: 40px;

    left: 0;

    right: 0;

    padding: 10px;

    overflow-y: auto;

    white-space: pre-wrap;

    scrollbar-width: thin;
}


#terminalInputLine {

    position: absolute;

    bottom: 0;

    left: 0;

    right: 0;

    height: 40px;

    display: flex;

    align-items: center;

    padding: 0 10px;

    border-top:
        1px solid rgba(0,255,102,.4);
}


#terminalPrompt {

    white-space: nowrap;
}


#terminalInput {

    flex: 1;

    background: transparent;

    border: none;

    outline: none;

    color: #00ff66;

    font-family:
        "Courier New",
        monospace;

    font-size: 14px;

    min-width: 0;
}


/* =====================================================
   CHAT
===================================================== */

#chatPanel {

    grid-column: 2;

    grid-row: 3;
}


#chatMessages {

    position: absolute;

    top: 32px;

    bottom: 42px;

    left: 0;

    right: 0;

    padding: 10px;

    overflow-y: auto;

    white-space: pre-wrap;
}


#chatInputLine {

    position: absolute;

    bottom: 0;

    left: 0;

    right: 0;

    height: 42px;

    display: flex;

    border-top:
        1px solid rgba(0,255,102,.4);
}


#chatInput {

    flex: 1;

    background: transparent;

    border: none;

    outline: none;

    color: #00ff66;

    padding: 0 10px;

    font-family:
        "Courier New",
        monospace;
}


/* =====================================================
   USERS
===================================================== */

#usersPanel {

    grid-column: 3;

    grid-row: 3;
}


#usersList {

    padding: 10px;

    overflow-y: auto;

    height:
        calc(100% - 32px);

    white-space: pre-wrap;
}


/* =====================================================
   MEDIA
===================================================== */

#mediaPanel {

    grid-column: 1 / 4;

    grid-row: 4;

    min-width: 0;

    min-height: 0;

    height: 500px;

    overflow: hidden;
}


#mediaContent {

    position: absolute;

    top: 32px;

    left: 0;

    right: 0;

    bottom: 0;

    display: flex;

    flex-direction: column;

    overflow: hidden;

    min-height: 0;
}


#mediaControls {

    padding: 8px;

    border-bottom:
        1px solid rgba(0,255,102,.35);

    display: flex;

    gap: 8px;

    align-items: center;

    flex-wrap: wrap;

    flex-shrink: 0;
}


#mediaFile {

    max-width: 220px;

    color: #00ff66;

    font-family:
        "Courier New",
        monospace;
}


#mediaNameInput {

    width: 220px;

    background: #001a08;

    color: #00ff66;

    border:
        1px solid #00ff66;

    padding: 5px 8px;

    font-family:
        "Courier New",
        monospace;

    outline: none;
}


#mediaNameInput::placeholder {

    color:
        rgba(0,255,102,.5);
}


#mediaNameInput:focus {

    box-shadow:
        0 0 8px rgba(0,255,102,.3);
}


.mediaButton {

    background: #001a08;

    color: #00ff66;

    border:
        1px solid #00ff66;

    padding: 5px 10px;

    font-family:
        "Courier New",
        monospace;

    cursor: pointer;
}


.mediaButton:hover {

    background: #00ff66;

    color: #001a08;
}


.mediaButton:disabled {

    opacity: .5;

    cursor: not-allowed;
}


#mediaStatus {

    font-size: 11px;

    width: 100%;
}


#mediaProgress {

    width: 100%;

    height: 8px;

    border:
        1px solid #00ff66;

    display: none;
}


#mediaProgressBar {

    height: 100%;

    width: 0%;

    background: #00ff66;

    box-shadow:
        0 0 8px #00ff66;
}


/* =====================================================
   MEDIA LIST
===================================================== */

#mediaList {

    flex: 1;

    min-height: 0;

    overflow: visible;

    padding: 10px;

    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(180px, 1fr)
        );

    grid-auto-rows:
        max-content;

    gap: 10px;
}


.mediaItem {

    border:
        1px solid rgba(0,255,102,.5);

    padding: 6px;

    min-width: 0;

    background:
        rgba(0,20,7,.7);
}


.mediaPreview {

    display: block;

    width: auto;

    height: auto;

    max-width: 100%;

    max-height: 250px;

    background: #000;

    margin:
        0 auto 5px auto;

    cursor: zoom-in;
}


.mediaName {

    font-size: 10px;

    word-break: break-all;

    margin-bottom: 4px;
}


.mediaInfo {

    font-size: 9px;

    opacity: .7;

    margin-bottom: 5px;
}


.mediaOpen {

    color: #00ff66;

    font-size: 10px;
}


/* =====================================================
   DIR
===================================================== */

#dirPanel {

    grid-column: 3;

    grid-row: 5;
}


#dirOutput {

    position: absolute;

    inset: 32px 0 0 0;

    overflow: hidden;

    padding: 10px;

    font-size: 12px;

    line-height: 1.35;
}


.dirLine {

    opacity: .8;

    animation:
        dirAppear .2s linear;
}


@keyframes dirAppear {

    from {
        opacity: 0;
    }

    to {
        opacity: .8;
    }
}


/* =====================================================
   MATRIX
===================================================== */

#matrixPanel {

    grid-column: 1 / 3;

    grid-row: 5;
}


#matrix {

    position: absolute;

    inset: 32px 0 0 0;

    width: 100%;

    height:
        calc(100% - 32px);
}


/* =====================================================
   MARLEY
===================================================== */

#marley {

    position: fixed;

    inset: 0;

    z-index: 8000;

    display: none;

    align-items: center;

    justify-content: center;

    pointer-events: none;

    background:
        radial-gradient(
            circle,
            rgba(255,0,120,.25),
            transparent 65%
        );
}


#marleyText {

    font-size:
        clamp(30px,8vw,100px);

    text-align: center;

    font-weight: bold;

    animation:
        marleyAnim 3s ease forwards;
}


@keyframes marleyAnim {

    0% {

        opacity: 0;

        transform:
            scale(.1)
            rotate(-30deg);
    }

    25% {

        opacity: 1;

        transform:
            scale(1.3)
            rotate(10deg);
    }

    50% {

        transform:
            scale(1)
            rotate(-5deg);
    }

    75% {

        opacity: 1;

        transform:
            scale(1.1);
    }

    100% {

        opacity: 0;

        transform:
            scale(1.5);
    }
}


/* =====================================================
   LIGHTBOX
===================================================== */

#mediaLightbox {

    position: fixed;

    inset: 0;

    z-index: 10000;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 30px;

    background:
        rgba(0,0,0,.88);

    backdrop-filter:
        blur(5px);

    cursor: zoom-out;
}


#mediaLightboxContent {

    position: relative;

    max-width: 95vw;

    max-height: 95vh;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    border:
        1px solid #00ff66;

    background:
        rgba(0,10,4,.96);

    box-shadow:
        0 0 30px rgba(0,255,102,.25),
        inset 0 0 30px rgba(0,255,102,.05);

    padding: 12px;

    cursor: default;
}


#mediaLightboxViewer {

    max-width: 90vw;

    max-height: 82vh;

    display: flex;

    align-items: center;

    justify-content: center;

    overflow: hidden;
}


#mediaLightboxViewer img,
#mediaLightboxViewer video {

    display: block;

    max-width: 90vw;

    max-height: 82vh;

    width: auto;

    height: auto;

    object-fit: contain;

    background: #000;

    box-shadow:
        0 0 20px rgba(0,255,102,.15);
}


#mediaLightboxClose {

    position: absolute;

    top: -15px;

    right: -15px;

    width: 34px;

    height: 34px;

    border:
        1px solid #00ff66;

    background:
        #001a08;

    color:
        #00ff66;

    font-family:
        "Courier New",
        monospace;

    font-size: 18px;

    cursor: pointer;

    z-index: 10;
}


#mediaLightboxClose:hover {

    background:
        #00ff66;

    color:
        #001a08;
}


#mediaLightboxName {

    width: 100%;

    margin-top: 8px;

    padding-top: 6px;

    border-top:
        1px solid rgba(0,255,102,.3);

    text-align: center;

    font-size: 11px;

    word-break: break-all;

    opacity: .8;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 900px) {

    #app {

        grid-template-columns:
            1fr 1fr;

        grid-template-rows:
            55px
            auto
            350px
            350px
            500px
            300px;
    }


    #header {

        grid-column:
            1 / 3;
    }


    #account-panel,
    #account-profile {

        grid-column:
            1 / 3;

        grid-row: 2;
    }


    #terminalPanel {

        grid-column: 1;

        grid-row: 3;
    }


    #chatPanel {

        grid-column: 2;

        grid-row: 3;
    }


    #usersPanel {

        grid-column:
            1 / 3;

        grid-row: 4;
    }


    #mediaPanel {

        grid-column:
            1 / 3;

        grid-row: 5;
    }


    #matrixPanel {

        grid-column: 1;

        grid-row: 6;
    }


    #dirPanel {

        grid-column: 2;

        grid-row: 6;
    }

}


@media (max-width: 700px) {

    #mediaLightbox {

        padding: 15px;
    }


    #mediaLightboxContent {

        max-width: 100vw;

        max-height: 95vh;

        padding: 8px;
    }


    #mediaLightboxViewer {

        max-width: 96vw;

        max-height: 82vh;
    }


    #mediaLightboxViewer img,
    #mediaLightboxViewer video {

        max-width: 96vw;

        max-height: 80vh;
    }


    #mediaLightboxClose {

        top: -10px;

        right: -10px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     CRT
===================================================== -->

<div id="crt">


<!-- =====================================================
     APP
===================================================== -->

<div id="app">


<!-- =====================================================
     HEADER
===================================================== -->

<div id="header">

    <div id="title">
        TERMINAL // NETWORK // DAVID OFFICIEL
    </div>

    <div id="connection">
        OFFLINE
    </div>

</div>


<!-- =====================================================
     COMPTE
===================================================== -->

<div id="account-panel">

    <!-- LOGIN -->

    <div id="login-box">

        <h2>Connexion</h2>

        <input
            type="text"
            id="login-username"
            placeholder="Pseudo"
            maxlength="20"
            autocomplete="username"
        >

        <input
            type="password"
            id="login-password"
            placeholder="Mot de passe"
            autocomplete="current-password"
        >

        <button id="login-button">
            Se connecter
        </button>

        <p id="login-error"></p>

        <button id="show-register-button">
            Créer un compte
        </button>

    </div>


    <!-- REGISTER -->

    <div
        id="register-box"
        style="display:none;"
    >

        <h2>Créer un compte</h2>

        <input
            type="text"
            id="register-username"
            placeholder="Pseudo"
            maxlength="20"
            autocomplete="username"
        >

        <input
            type="password"
            id="register-password"
            placeholder="Mot de passe"
            autocomplete="new-password"
        >

        <input
            type="password"
            id="register-password-confirm"
            placeholder="Confirmer le mot de passe"
            autocomplete="new-password"
        >

        <input
            type="url"
            id="register-avatar"
            placeholder="URL de ton avatar (facultatif)"
        >

        <button id="register-button">
            Créer le compte
        </button>

        <p id="register-error"></p>

        <button id="show-login-button">
            J'ai déjà un compte
        </button>

    </div>

</div>


<!-- =====================================================
     PROFIL
===================================================== -->

<div
    id="account-profile"
    style="display:none;"
>

    <img
        id="account-avatar"
        src=""
        alt="Avatar"
        width="64"
        height="64"
    >

    <div>

        <strong id="account-username">
            Utilisateur
        </strong>

        <br>

        <button id="logout-button">
            Se déconnecter
        </button>

    </div>

</div>


<!-- =====================================================
     TERMINAL
===================================================== -->

<div
    id="terminalPanel"
    class="panel"
>

    <div class="panelTitle">
        [ TERMINAL ]
    </div>

    <div id="terminalOutput"></div>

    <div id="terminalInputLine">

        <span id="terminalPrompt">
            guest@terminal:~$
        </span>

        <input
            id="terminalInput"
            autocomplete="off"
        >

    </div>

</div>


<!-- =====================================================
     CHAT
===================================================== -->

<div
    id="chatPanel"
    class="panel"
>

    <div class="panelTitle">
        [ PROXIMITY CHAT ]
    </div>

    <div id="chatMessages"></div>

    <div id="chatInputLine">

        <input
            id="chatInput"
            placeholder="message..."
            autocomplete="off"
        >

    </div>

</div>


<!-- =====================================================
     USERS
===================================================== -->

<div
    id="usersPanel"
    class="panel"
>

    <div class="panelTitle">
        [ USERS ONLINE ]
    </div>

    <div id="usersList">
        SYSTEM: 0 USERS
    </div>

</div>


<!-- =====================================================
     MEDIA
===================================================== -->

<div
    id="mediaPanel"
    class="panel"
>

    <div class="panelTitle">
        [ MEDIA // GITHUB ]
    </div>

    <div id="mediaContent">

        <div id="mediaControls">

            <input
                type="file"
                id="mediaFile"
                accept="image/jpeg,image/png,image/gif,image/webp,video/mp4,video/webm,video/quicktime"
            >

            <input
                type="text"
                id="mediaNameInput"
                placeholder="Nom du fichier..."
                maxlength="100"
                autocomplete="off"
            >

            <button
                class="mediaButton"
                id="uploadButton"
            >
                UPLOAD
            </button>

            <button
                class="mediaButton"
                id="refreshMedia"
            >
                REFRESH
            </button>

            <div id="mediaStatus">
                READY.
            </div>

            <div id="mediaProgress">

                <div id="mediaProgressBar"></div>

            </div>

        </div>

        <div id="mediaList"></div>

    </div>

</div>


<!-- =====================================================

/* =====================================================
   WEBSOCKET
===================================================== */

function connect() {

    if (
        !currentUser ||
        !currentUser.username
    ) {

        connection.textContent =
            "● LOGIN REQUIRED";

        return;
    }


    if (
        socket &&
        (
            socket.readyState ===
                WebSocket.OPEN ||
            socket.readyState ===
                WebSocket.CONNECTING
        )
    ) {

        return;
    }


    if (reconnectTimer) {

        clearTimeout(
            reconnectTimer
        );

        reconnectTimer =
            null;
    }


    username =
        currentUser.username;


    terminalPrompt.textContent =
        username +
        "@terminal:~$";


    terminalPrint(
        "Initialisation..."
    );

    terminalPrint(
        "Connexion au serveur..."
    );


    try {

        socket =
            new WebSocket(
                SERVER
            );

    } catch (error) {

        console.error(
            "[WEBSOCKET] Création:",
            error
        );

        connection.textContent =
            "● ERROR";

        return;
    }


    /* =================================================
       OPEN
    ================================================= */

    socket.onopen = () => {

        connection.textContent =
            "● ONLINE";


        terminalPrint(
            "[OK] Serveur connecté."
        );


        socket.send(
            JSON.stringify({

                type:
                    "join",

                username:
                    currentUser.username

            })
        );


        /* HEARTBEAT UNIQUE */

        if (heartbeatTimer) {

            clearInterval(
                heartbeatTimer
            );
        }


        heartbeatTimer =
            setInterval(
                () => {

                    if (
                        socket &&
                        socket.readyState ===
                            WebSocket.OPEN
                    ) {

                        try {

                            socket.send(
                                JSON.stringify({

                                    type:
                                        "ping"

                                })
                            );

                        } catch (error) {

                            console.error(
                                "[HEARTBEAT]",
                                error
                            );
                        }

                    }

                },
                30000
            );


        terminalInput.focus();
    };


    /* =================================================
       MESSAGE
    ================================================= */

    socket.onmessage =
        event => {

            let data;


            try {

                data =
                    JSON.parse(
                        event.data
                    );

            } catch (error) {

                console.warn(
                    "[WEBSOCKET] Message JSON invalide:",
                    event.data
                );

                return;
            }


            if (
                data.type ===
                "system"
            ) {

                terminalPrint(
                    "[SYSTEM] " +
                    data.message
                );
            }


            if (
                data.type ===
                "join"
            ) {

                terminalPrint(
                    "[+] " +
                    data.username +
                    " vient de rejoindre."
                );
            }


            if (
                data.type ===
                "leave"
            ) {

                terminalPrint(
                    "[-] " +
                    data.username +
                    " est parti."
                );
            }


            if (
                data.type ===
                "chat"
            ) {

                chatPrint(
                    data.username,
                    data.message
                );
            }


            if (
                data.type ===
                "users"
            ) {

                const users =
                    Array.isArray(data.users)
                        ? data.users
                        : [];


                usersList.textContent =
                    "SYSTEM: " +
                    users.length +
                    " USERS\n\n" +
                    users.join("\n");
            }


            if (
                data.type ===
                "marley"
            ) {

                terminalPrint(
                    "[EASTER EGG] " +
                    data.username +
                    " a trouvé quelque chose..."
                );

                marleyAnimation();
            }


            if (
                data.type ===
                "media"
            ) {

                terminalPrint(
                    "[MEDIA] " +
                    data.username +
                    " a uploadé " +
                    data.name
                );

                addMedia(data);
            }

        };


    /* =================================================
       ERROR
    ================================================= */

    socket.onerror =
        error => {

            console.error(
                "[WEBSOCKET] Error:",
                error
            );


            connection.textContent =
                "● ERROR";


            terminalPrint(
                "[ERROR] WebSocket error."
            );
        };


    /* =================================================
       CLOSE
    ================================================= */

    socket.onclose =
        () => {

            connection.textContent =
                "● OFFLINE";


            if (heartbeatTimer) {

                clearInterval(
                    heartbeatTimer
                );

                heartbeatTimer =
                    null;
            }


            terminalPrint(
                "[SYSTEM] Connexion perdue."
            );


            socket =
                null;


            if (!currentUser) {

                return;
            }


            if (!reconnectTimer) {

                reconnectTimer =
                    setTimeout(
                        () => {

                            reconnectTimer =
                                null;


                            if (
                                currentUser
                            ) {

                                terminalPrint(
                                    "[SYSTEM] Reconnexion..."
                                );


                                connect();
                            }

                        },
                        5000
                    );
            }

        };

}

/* =====================================================

async function terminalCommand(command) {

    const lower =
        command
            .trim()
            .toLowerCase();


    terminalPrint(
        terminalPrompt.textContent +
        " " +
        command
    );


    /* DIR */

    if (

                    API +

            if (!response.ok) {

                throw new Error(
                    "HTTP " +
                    response.status
                );
            }


            const files =
                await response.json();


            if (
                Array.isArray(files)
            ) {

                files.forEach(
                    file =>
                        terminalPrint(file)
                );

            }

        } catch (error) {

            terminalPrint(
                "[ERROR] FILE SYSTEM OFFLINE."
            );

            console.error(
                "[DIR]",
                error
            );
        }


        return;
    }


    /* MEDIA */

    if (
        lower ===
        "media"
    ) {

        await loadMedia();

        terminalPrint(
            "[MEDIA] Liste actualisée."
        );

        return;
    }


    /* CLEAR */

    if (
        lower ===
        "clear"
    ) {

            "";

        return;
    }


    /* HELP */

    if (
        lower ===
        "help"
    ) {

        terminalPrint(

        terminalPrint(
            "dir /s"
        );

        terminalPrint(
            "media"
        );

        terminalPrint(
            "clear"

            "help"
        );

        terminalPrint(
            "chat <message>"
        );

        terminalPrint(
            "disco"
        );

        terminalPrint(
            "broken"
        );

        terminalPrint(
            "david"
        );

        return;
    }


    /* MARLEY */

    if (
        lower
            .replace(
                /[.!?]+$/g,
                ""
            )
            .trim() ===
        "i love you marley"
    ) {

        sendChat(
            command
        );

        return;
    }


    if (
        lower ===

    ) {

        return;
    }


    /* BROKEN */

    if (
    lower ===
    "broken"
    ) {

        "https://david-wiki.neocities.org/",
        "_blank",
        "noopener,noreferrer"
    );

    terminalPrint(
        "[EASTER EGG] Ouverture de DAVID WIKI..."
    );

    return;
    }


    /* DAVID */

    if (
    lower ===
    "david"
    ) {

    window.open(
        "https://www.tiktok.com/@0cherif_cat0",
        "_blank",
        "noopener,noreferrer"
    );

    terminalPrint(
        "[EASTER EGG] Ouverture du profil DAVID..."
    );

    return;
    } 


    /* DISCO */

    if (
        lower ===
        "disco"
    ) {

        discoMode =
            !discoMode;


        document.body.classList.toggle(
            "discoMode",
            discoMode
        );


        if (discoMode) {

            terminalPrint(
                "[EASTER EGG] 🌈 DISCO MODE ON 🌈"
            );

        } else {

            terminalPrint(
                "[EASTER EGG] DISCO MODE OFF."
            );
        }


        return;
    }


    /* CHAT */

    if (
        lower.startsWith(

    /* COMMANDE NORMALE */

/* =====================================================

===================================================== */

function formatSize(bytes) {

    if (!Number.isFinite(bytes)) {
        return "0 B";
    }


    if (
        bytes <
        1024
    ) {

        return (
            Math.round(bytes) +
            " B"
        );
    }


    if (
        bytes <
        1024 * 1024
    ) {

        return (
            (bytes / 1024)
                .toFixed(1) +
            " KB"
        );
    }


    return (
        (bytes / 1024 / 1024)
            .toFixed(2) +
        " MB"
    );
}


/* =====================================================
   VIDEO DETECTION
===================================================== */

function isVideo(file) {

    if (!file) {
        return false;
    }


    const name =
        String(
            file.name ||
            file.url ||
            ""
        ).toLowerCase();


    return (
        name.endsWith(".mp4") ||
        name.endsWith(".webm") ||
        name.endsWith(".mov")
    );
}


/* =====================================================
   LIGHTBOX OPEN
===================================================== */

function openMediaLightbox(file) {

    if (!file || !file.url) {
        return;
    }


    mediaLightboxViewer.innerHTML =
        "";


    mediaLightboxName.textContent =
        file.name ||
        "MEDIA";


    let viewer;


    if (
        isVideo(file)
    ) {

        viewer =
            document.createElement(
                "video"
            );


        viewer.controls =
            true;

        viewer.preload =
            "metadata";

        viewer.playsInline =
            true;

        viewer.muted =
            false;

        viewer.volume =
            1;

    } else {

        viewer =
            document.createElement(
                "img"
            );


        viewer.alt =
            file.name ||
            "MEDIA";
    }


    viewer.src =
        file.url;


    mediaLightboxViewer.appendChild(
        viewer
    );


    mediaLightbox.style.display =
        "flex";


    document.body.style.overflow =
        "hidden";
}


/* =====================================================
   LIGHTBOX CLOSE
===================================================== */

function closeMediaLightbox() {

    const video =
        mediaLightboxViewer.querySelector(
            "video"
        );


    if (video) {

        video.pause();

        video.removeAttribute(
            "src"
        );

        video.load();
    }


    mediaLightboxViewer.innerHTML =
        "";


    mediaLightbox.style.display =
        "none";


    document.body.style.overflow =
        "";
}

            event.key ===
                "Escape" &&
            mediaLightbox.style.display ===
                "flex"
        ) {

            closeMediaLightbox();
        }

    }
);


/* =====================================================
   ADD MEDIA
===================================================== */

function addMedia(file) {

    if (!file) {
        return;
    }


    const mediaPath =
        file.path ||
        file.name ||
        file.url;


    if (!mediaPath) {
        return;
    }


    const existing =
        document.querySelector(
            `[data-media-path="${CSS.escape(
                String(mediaPath)
            )}"]`
        );


    if (existing) {
        return;
    }


    const item =
        document.createElement(
            "div"
        );


    item.className =
        "mediaItem";


    item.dataset.mediaPath =
        String(mediaPath);


    let preview;


    /* VIDEO */

    if (
        isVideo(file)
    ) {

        preview =
            document.createElement(
                "video"
            );


        preview.className =
            "mediaPreview";


        preview.src =
            file.url;


        preview.controls =
            true;


        preview.preload =
            "metadata";


        preview.playsInline =
            true;


        preview.muted =
            true;

    }


    /* IMAGE */

    else {

        preview =
            document.createElement(
                "img"
            );


        preview.className =
            "mediaPreview";


        preview.src =
            file.url;


        preview.alt =
            file.name ||
            "MEDIA";
    }


    /* DOUBLE CLICK LIGHTBOX */

    preview.addEventListener(
        "dblclick",
        event => {

            event.preventDefault();

            openMediaLightbox(
                file
            );

        }
    );


    /* NAME */

    const name =
        document.createElement(
            "div"
        );


    name.className =
        "mediaName";


    name.textContent =
        file.name ||
        "MEDIA";


    /* INFO */

    const info =
        document.createElement(
            "div"
        );


    info.className =
        "mediaInfo";


    info.textContent =
        formatSize(
            Number(file.size) || 0
        );


    /* LINK */

    const link =
        document.createElement(
            "a"
        );


    link.className =
        "mediaOpen";


    link.href =
        file.url;


    link.target =
        "_blank";


    link.rel =
        "noopener noreferrer";


    link.textContent =
        "[ OPEN ]";


    /* APPEND */

    item.appendChild(
        preview
    );


    item.appendChild(
        name
    );


    item.appendChild(
        info
    );


    item.appendChild(
        link
    );


    mediaList.prepend(
        item
    );
}


/* =====================================================
   LOAD MEDIA
===================================================== */

async function loadMedia() {

    if (!mediaList) {
        return;
    }


    try {

        mediaStatus.textContent =
            "LOADING MEDIA...";


        const response =
            await fetch(
                API +
                "/api/media"
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );
        }


        const files =
            await response.json();


        if (
            !Array.isArray(files)
        ) {

            throw new Error(
                "Réponse serveur invalide."
            );
        }


        mediaList.innerHTML =
            "";


        files.forEach(
            file => {

                addMedia(
                    file
                );

            }
        );


        mediaStatus.textContent =
            "[OK] " +
            files.length +
            " MEDIA LOADED.";


    } catch (error) {

        console.error(
            "[MEDIA] Erreur chargement:",
            error
        );


        mediaStatus.textContent =
            "[ERROR] MEDIA SYSTEM OFFLINE.";
    }
}

/* =====================================================
   UPLOAD
===================================================== */

uploadButton.addEventListener(
    "click",
    () => {

        const file =
            mediaFile.files[0];


        if (!file) {

            mediaStatus.textContent =
                "[ERROR] SELECT A FILE.";

            return;
        }


        const MAX =
            25 *
            1024 *
            1024;


        if (
            file.size >
            MAX
        ) {

            mediaStatus.textContent =
                "[ERROR] MAXIMUM 25 MB.";

            return;
        }


        let customName =
            mediaNameInput.value.trim();


        if (!customName) {

            customName =
                file.name.replace(
                    /\.[^/.]+$/,
                    ""
                );
        }


        customName =
            customName
                .replace(
                    /[<>:"/\\|?*\x00-\x1F]/g,
                    ""
                )
                .replace(
                    /\s+/g,
                    " "
                )
                .trim()
                .substring(
                    0,
                    100
                );


        if (!customName) {

            mediaStatus.textContent =
                "[ERROR] INVALID FILE NAME.";

            return;
        }


        const extension =
            file.name.includes(".")
                ? "." +
                    file.name
                        .split(".")
                        .pop()
                        .toLowerCase()
                : "";


        const finalName =
            customName +
            extension;


        const renamedFile =
            new File(
                [file],
                finalName,
                {
                    type:
                        file.type
                }
            );


        const form =
            new FormData();


        form.append(
            "file",
            renamedFile
        );


        form.append(
            "username",
            currentUser?.username ||
            username ||
            "guest"
        );


        const xhr =
            new XMLHttpRequest();

        xhr.open(
          "POST",
          API +
          "/api/upload"
        );

        xhr.withCredentials = true;


        mediaProgress.style.display =
            "block";


        mediaProgressBar.style.width =
            "0%";


        uploadButton.disabled =
            true;


        mediaStatus.textContent =
            "UPLOADING...";


        xhr.upload.onprogress =
            event => {

                if (
                    !event.lengthComputable
                ) {

                    return;
                }


                const percent =
                    Math.round(
                        event.loaded /
                        event.total *
                        100
                    );


                mediaProgressBar.style.width =
                    percent +
                    "%";


                mediaStatus.textContent =
                    "UPLOADING... " +
                    percent +
                    "%";
            };


        xhr.onload =
            () => {

                uploadButton.disabled =
                    false;


                let data;


                try {

                    data =
                        JSON.parse(
                            xhr.responseText
                        );

                } catch {

                    data =
                        {};
                }


                if (
                    xhr.status >= 200 &&
                    xhr.status < 300 &&
                    data.success
                ) {

                    mediaStatus.textContent =
                        "[OK] UPLOAD COMPLETE.";


                    addMedia({

                        name:
                            data.name ||
                            finalName,

                        url:
                            data.url,

                        size:
                            data.size ||
                            file.size,

                        path:
                            "uploaded/" +
                            (
                                data.name ||
                                finalName
                            )

                    });


                    mediaFile.value =
                        "";


                    mediaNameInput.value =
                        "";


                } else {

                    mediaStatus.textContent =
                        "[ERROR] " +
                        (
                            data.error ||
                            "UPLOAD FAILED."
                        );
                }

            };


        xhr.onerror =
            () => {

                uploadButton.disabled =
                    false;


                mediaStatus.textContent =
                    "[ERROR] NETWORK ERROR.";
            };


        xhr.onloadend =
            () => {

                setTimeout(
                    () => {

                        mediaProgress.style.display =
                            "none";

                    },
                    1000
                );

            };


        xhr.send(
            form
        );

    }
);

/* =====================================================
   MATRIX
===================================================== */

function startMatrix() {

    const canvas =
        document.getElementById(
            "matrix"
        );


    if (!canvas) {
        return;
    }


    const ctx =
        canvas.getContext(
            "2d"
        );


    if (!ctx) {
        return;
    }


    const chars =
        "01#$%アイウエオ親愛なるプラウト愛してるよ、マーリー";


    const fontSize =
        12;


    let columns =
        0;


    let drops =
        [];


    function resize() {

        canvas.width =
            canvas.clientWidth;


        canvas.height =
            canvas.clientHeight;


        columns =
            Math.max(
                1,
                Math.floor(
                    canvas.width /
                    fontSize
                )
            );


        drops =
            new Array(
                columns
            ).fill(1);
    }


    resize();


    window.addEventListener(
        "resize",
        resize
    );


    setInterval(
        () => {

            ctx.fillStyle =
                "rgba(0,0,0,.08)";


            ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            ctx.fillStyle =
                "#00ff66";


            ctx.font =
                fontSize +
                "px monospace";


            for (
                let i = 0;
                i < drops.length;
                i++
            ) {

                const char =
                    chars[
                        Math.floor(
                            Math.random() *
                            chars.length
                        )
                    ];


                ctx.fillText(
                    char,
                    i * fontSize,
                    drops[i] *
                        fontSize
                );


                if (
                    drops[i] *
                        fontSize >
                        canvas.height &&
                    Math.random() >
                        .975
                ) {

                    drops[i] =
                        0;
                }


                drops[i]++;
            }

        },
        45
    );
}

        if (!response.ok) {

            );

        ) {

            throw new Error(
                "Invalid files response"
            );
        }


    } catch {

        dirFiles = [

            "C:\\SYSTEM\\BOOT.INI",

            "C:\\SYSTEM\\CONFIG.SYS",

            "C:\\TERMINAL\\CHAT.LOG",

            "C:\\USERS\\GUEST\\DATA.DAT",

            "C:\\NETWORK\\SOCKET.WS"

        ];
    }
}


/* =====================================================
   INFINITE DIR
===================================================== */

async function startInfiniteDir() {

    await loadDirFiles();


    if (
        !dirFiles.length
    ) {

        return;
    }


    setInterval(
        () => {

            const line =
                document.createElement(
                    "div"
                );


            const file =
                dirFiles[
                    dirIndex %
                    dirFiles.length
                ];


            dirIndex++;


            line.className =
                "dirLine";


            line.textContent =
                "C:\\>" +
                file;


            dirOutput.appendChild(
                line
            );


            while (
                dirOutput.children.length >
                35
            ) {

                dirOutput.removeChild(
                    dirOutput.firstChild
                );
            }

        },
        250
    );
}

        "LOADING CHAT...",

        i <= 100;
        i++
    ) {

                Math.floor(
                    i /

            );
